<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#161310">
<title>Burger Hunch × MOLT Menu</title>
<script>document.documentElement.classList.add("js")</script>
<link rel="preload" href="assets/fonts/barlow-condensed-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/hero/hero-smokey-beef.webp" as="image">
<style>
/*
VOICE   Fire-side, confident, short. A menu you browse at the table; the waiter takes the order.
IDEA    The grill station: charcoal stone, orange heat, fresh grill marks, packaging-paper lattice.
PICTURE The real Smokey Burger halves and the stamp-free Bogota on stone, smoke and embers rising.
COLOUR  Charcoal #161310 dominant, cream #F4E8D8 support, Hunch orange #F26A21 accent.
TYPE    Barlow Condensed 800 for the voice, Readex Pro for reading (Latin + Arabic).
LAYOUT  Slim header, hero, sticky cream category bar, each section opened like a chapter, orange tape between.
*/
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(assets/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(assets/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(assets/fonts/barlow-condensed-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:"Readex Pro";font-weight:300;font-display:swap;src:url(assets/fonts/readex-pro-arabic-300-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex Pro";font-weight:400;font-display:swap;src:url(assets/fonts/readex-pro-arabic-400-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex Pro";font-weight:600;font-display:swap;src:url(assets/fonts/readex-pro-arabic-600-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex Pro";font-weight:700;font-display:swap;src:url(assets/fonts/readex-pro-arabic-700-normal.woff2) format("woff2");unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:"Readex Pro";font-weight:300;font-display:swap;src:url(assets/fonts/readex-pro-latin-300-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Readex Pro";font-weight:400;font-display:swap;src:url(assets/fonts/readex-pro-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}
@font-face{font-family:"Readex Pro";font-weight:600;font-display:swap;src:url(assets/fonts/readex-pro-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC,U+2122}

:root{
  color-scheme:dark;
  --char:#161310;--stone:#1e1a16;--panel:#211c18;--line:rgba(244,232,216,.13);
  --cream:#f4e8d8;--soft:#b9ab99;--orange:#f26a21;--ember:#ff8a3d;--ink:#1b1612;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --text:"Readex Pro",system-ui,sans-serif;
  --pad:max(5vw,16px);--bar:58px;--ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--char);color:var(--cream);font:300 16px/1.55 var(--text);overflow-x:clip;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:3px solid var(--ember);outline-offset:3px;border-radius:6px}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:50;background:var(--cream);color:var(--ink);padding:10px 14px;border-radius:8px;font-weight:600}
.skip:focus{top:10px}

/* opening curtain */
.splash{display:none}
.js .splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--char);transition:transform 1s cubic-bezier(.75,0,.2,1)}
.splash .in{display:grid;justify-items:center;gap:22px}
.splash img{width:min(280px,62vw);opacity:0;transform:translateY(14px);animation:sIn .8s var(--ease) .15s forwards}
.splash i{display:block;width:min(280px,62vw);height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--orange) 20%,#ffd2a0 50%,var(--orange) 80%,transparent);box-shadow:0 0 22px rgba(255,138,61,.9);transform:scaleX(0);animation:sLine 1s var(--ease) .5s forwards}
.splash.out{transform:translateY(-100%)}
.splash[hidden]{display:none}
@keyframes sIn{to{opacity:1;transform:none}}
@keyframes sLine{to{transform:scaleX(1)}}

/* header */
.top{background:var(--char);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:12px var(--pad);display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand img{height:clamp(30px,4.6vw,46px);width:auto}
.lang{display:flex;align-items:center;gap:2px;min-height:44px;padding:0 4px;font:600 15px/1 var(--text);color:var(--soft)}
.lang span{padding:8px 6px;border-radius:6px;transition:color .2s}
.lang .on{color:var(--cream)}
.lang i{font-style:normal;opacity:.5}

/* hero */
.hero{position:relative;overflow:hidden;height:clamp(360px,58vw,560px);background:#0d0b09 url(assets/hero/hero-table.webp) center 70%/cover no-repeat;isolation:isolate}
@media (orientation:landscape) and (min-width:900px){.hero{height:clamp(400px,48vw,560px)}}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(60% 45% at 50% 92%,rgba(242,106,33,.34),transparent 70%),linear-gradient(180deg,rgba(10,8,6,.55),rgba(10,8,6,0) 45%,rgba(10,8,6,.5));animation:glow 3.2s ease-in-out infinite alternate}
.hero h1{position:absolute;inset-inline:0;top:clamp(18px,4vw,40px);margin:0;text-align:center;font:800 clamp(54px,15.6vw,168px)/.84 var(--display);text-transform:uppercase;letter-spacing:-.005em;z-index:1;transform:translate3d(0,var(--hy,0px),0);opacity:var(--ho,1)}
.hero h1>span{display:block}
.hero h1 .w{display:inline-block;white-space:nowrap}
.hero h1 .c{display:inline-block}
.l1{color:var(--cream);font-size:.78em}
.l2{color:var(--orange);text-shadow:0 0 38px rgba(242,106,33,.35);--d0:240ms}
[dir=rtl] .hero h1{font:700 clamp(50px,12vw,128px)/1.05 var(--text);letter-spacing:0}
.food{position:absolute;top:0;bottom:0;left:50%;width:min(100%,980px);transform:translate3d(-50%,var(--fy,0px),0);z-index:2;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;gap:var(--fg,2%);padding:0 3% var(--fb,3%)}
.beef{flex:none;width:var(--bw,52%);filter:drop-shadow(0 22px 22px rgba(0,0,0,.6))}
.sao{flex:none;width:var(--sw,40%);filter:drop-shadow(0 22px 24px rgba(0,0,0,.65))}
.lattice{position:absolute;right:-4%;bottom:-6%;width:44%;height:38%;z-index:1;opacity:.75;transform:rotate(-8deg);clip-path:polygon(9% 30%,30% 12%,58% 18%,82% 2%,100% 8%,100% 100%,0 100%);background:repeating-linear-gradient(45deg,transparent 0 13px,rgba(236,218,194,.55) 13px 15px),repeating-linear-gradient(-45deg,transparent 0 13px,rgba(236,218,194,.55) 13px 15px)}
.sparks,.smoke{position:absolute;inset:0;z-index:1;pointer-events:none}
.sparks i{position:absolute;bottom:18%;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:var(--ember);box-shadow:0 0 8px 2px rgba(255,138,61,.7);opacity:0;animation:rise var(--d) linear var(--w) infinite}
.smoke i{position:absolute;bottom:14%;left:var(--x);width:clamp(140px,26vw,260px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(235,225,210,.14),transparent 66%);filter:blur(14px);opacity:0;animation:smoke var(--d) ease-in var(--w) infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}12%{opacity:1}100%{transform:translate(var(--dx),-340px);opacity:0}}
@keyframes smoke{0%{transform:translate(0,40px) scale(.5);opacity:0}35%{opacity:1}100%{transform:translate(var(--dx),-300px) scale(1.7);opacity:0}}
@keyframes glow{to{opacity:.72}}
@keyframes heat{to{text-shadow:0 0 70px rgba(242,106,33,.6),0 0 18px rgba(255,160,90,.35)}}
/* hero load sequence */
.js .hero h1 .c{opacity:0;transform:translateY(55%) rotate(5deg);filter:blur(8px)}
.js .beef,.js .sao{opacity:0;transform:translateY(60px) scale(.94)}
.js .lattice{opacity:0;transform:rotate(-8deg) translateY(40px)}
.ready .hero h1 .c{opacity:1;transform:none;filter:none;transition:transform .9s cubic-bezier(.2,.9,.25,1.12),opacity .5s ease,filter .7s ease;transition-delay:calc(var(--i)*38ms + var(--d0,0ms))}
.ready .l2{animation:heat 2.8s ease-in-out 1.8s infinite alternate}
.ready .beef,.ready .sao{opacity:1;transform:none;transition:opacity .8s ease .55s,transform 1.2s cubic-bezier(.2,.9,.25,1.06) .55s}
.ready .sao{transition-delay:.72s}
.ready .lattice{opacity:.75;transform:rotate(-8deg);transition:opacity 1.2s ease .9s,transform 1.4s var(--ease) .9s}

/* category bar */
.bar{position:sticky;top:0;z-index:20;background:var(--cream);color:var(--ink);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tabs{position:relative;max-width:1240px;margin:0 auto;padding:0 var(--pad);display:flex;justify-content:space-around;gap:clamp(14px,3vw,40px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:var(--bar);padding:0 4px;white-space:nowrap;font:700 clamp(16px,2.6vw,26px)/1 var(--display);color:#5b4e42;transition:color .25s,transform .25s}
.tab:active{transform:scale(.95)}
[dir=rtl] .tab{font:600 clamp(15px,2.3vw,20px)/1 var(--text)}
@media (max-width:340px){.tabs{padding:0 10px;gap:12px}[dir=rtl] .tab{font-size:14px}}
.tab[aria-current=true]{color:var(--ink)}
.ind{position:absolute;bottom:0;left:0;height:4px;border-radius:3px 3px 0 0;background:var(--orange);transition:transform .5s cubic-bezier(.3,1.3,.4,1),width .5s cubic-bezier(.3,1.3,.4,1)}
.prog{position:absolute;inset-inline:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--orange),var(--ember));transform:scaleX(var(--p,0));transform-origin:0 50%;box-shadow:0 0 10px rgba(255,138,61,.6)}
[dir=rtl] .prog{transform-origin:100% 50%}

/* sections */
main{max-width:1240px;margin:0 auto;padding:0 var(--pad) 20px}
main.swap{animation:swap .45s ease}
@keyframes swap{from{opacity:0;transform:translateY(10px)}}
.sec{scroll-margin-top:var(--bar)}
.op{position:relative;padding:clamp(48px,8vw,104px) 0 clamp(14px,2.4vw,26px);isolation:isolate}
.ghost{position:absolute;inset-inline:calc(50% - 50vw);top:clamp(14px,3vw,40px);z-index:-1;overflow:hidden;pointer-events:none;white-space:nowrap;line-height:0}
.ghost span{display:inline-block;font:800 clamp(130px,25vw,320px)/.8 var(--display);text-transform:uppercase;color:transparent;-webkit-text-stroke:1.5px rgba(244,232,216,.08);transform:translate3d(var(--gx,0px),0,0);will-change:transform}
[dir=rtl] .ghost span{font:700 clamp(110px,21vw,260px)/1.1 var(--text)}
.ttl{margin:0;font:800 clamp(52px,8.4vw,104px)/.88 var(--display);text-transform:uppercase;letter-spacing:-.005em}
[dir=rtl] .ttl{font:700 clamp(40px,6.6vw,76px)/1.2 var(--text)}
.tag{margin:14px 0 0;max-width:44ch;font-size:clamp(16px,2vw,21px);line-height:1.45;color:#d6c9b7}
.sear{display:flex;gap:clamp(10px,1.6vw,16px);margin-top:clamp(18px,2.6vw,26px);padding-inline-start:10px}
.sear i{width:clamp(44px,6.6vw,82px);height:7px;border-radius:4px;background:#5a2a12;transform:skewX(-35deg) scaleX(0);transform-origin:0 50%}
[dir=rtl] .sear i{transform:skewX(35deg) scaleX(0);transform-origin:100% 50%}
.js .op .ttl{clip-path:inset(0 -5% 100% -5%);transform:translateY(35%)}
.js .op .tag{opacity:0;transform:translateY(14px)}
.op.seen .ttl{clip-path:inset(-20% -5% -25% -5%);transform:none;transition:clip-path .9s var(--ease),transform .9s var(--ease)}
.op.seen .tag{opacity:1;transform:none;transition:opacity .7s ease .3s,transform .8s var(--ease) .3s}
.op.seen .sear i{animation:sear 1.8s var(--ease) forwards;animation-delay:calc(var(--n)*120ms + 380ms)}
[dir=rtl] .op.seen .sear i{animation-name:searR}
@keyframes sear{0%{transform:skewX(-35deg) scaleX(0);background:#fff1d6;box-shadow:0 0 24px 7px rgba(255,170,90,.9)}35%{transform:skewX(-35deg) scaleX(1);background:#ff8a3d;box-shadow:0 0 18px 4px rgba(255,120,40,.7)}100%{transform:skewX(-35deg) scaleX(1);background:#7a3414;box-shadow:0 0 0 0 transparent}}
@keyframes searR{0%{transform:skewX(35deg) scaleX(0);background:#fff1d6;box-shadow:0 0 24px 7px rgba(255,170,90,.9)}35%{transform:skewX(35deg) scaleX(1);background:#ff8a3d;box-shadow:0 0 18px 4px rgba(255,120,40,.7)}100%{transform:skewX(35deg) scaleX(1);background:#7a3414;box-shadow:0 0 0 0 transparent}}

/* orange tape between sections */
.tapewrap{position:relative;z-index:2;overflow:hidden;margin:clamp(40px,6vw,76px) calc(50% - 50vw) 0;padding:24px 0}
.tape{direction:ltr;position:relative;margin:0 -60px;padding:clamp(12px,1.6vw,18px) 0;background:var(--orange);color:var(--ink);transform:rotate(var(--r,-2deg));box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden}
.tape::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(27,22,18,.06) 12px 14px),repeating-linear-gradient(-45deg,transparent 0 12px,rgba(27,22,18,.06) 12px 14px);pointer-events:none}
.track{display:flex;width:max-content;transform:translate3d(var(--tx,0px),0,0);will-change:transform}
.track span{display:inline-flex;align-items:center;gap:clamp(16px,2.4vw,28px);padding-inline-end:clamp(16px,2.4vw,28px);font:800 clamp(28px,4.4vw,52px)/1 var(--display);text-transform:uppercase;white-space:nowrap}
[dir=rtl] .track span{font:700 clamp(22px,3.4vw,38px)/1.25 var(--text)}
.track svg{width:.62em;height:.8em;flex:none;fill:var(--ink)}

/* dishes */
.item{position:relative;display:grid;grid-template-columns:minmax(0,clamp(180px,30vw,330px)) minmax(0,1fr);align-items:center;gap:clamp(18px,3.5vw,48px);padding:clamp(16px,2.2vw,24px) 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.flip{grid-template-columns:minmax(0,1fr) minmax(0,clamp(180px,30vw,330px))}
.item.flip .ph{order:2}
.ph{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--stone)}
.ph img{width:100%;height:100%;object-fit:cover;transform:scale(1.02);transition:transform .6s var(--ease)}
.ph::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 70%,rgba(255,120,40,.5),transparent 62%);opacity:0;pointer-events:none;mix-blend-mode:screen}
.name{margin:0;font:800 clamp(30px,3.8vw,46px)/1 var(--display);color:var(--cream)}
[dir=rtl] .name{font:700 clamp(22px,2.9vw,32px)/1.3 var(--text)}
.desc{margin:10px 0 0;max-width:58ch;color:var(--soft);font-size:clamp(15px,1.6vw,17px)}
.prices{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.price{display:inline-flex;align-items:baseline;gap:8px;min-height:46px;padding:9px 14px;border:1px solid var(--line);border-radius:12px;font:700 clamp(23px,2.7vw,28px)/1 var(--display);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--cream)}
.price .lb{font:400 15px/1 var(--text);color:var(--soft);margin-inline-end:6px}
.price .cur{font:600 .58em/1 var(--display);color:var(--orange);letter-spacing:.02em}
.price.solo{border:0;padding:0;min-height:0}
[dir=rtl] .price{font:600 clamp(19px,2.2vw,23px)/1 var(--text)}
[dir=rtl] .price .cur{font:400 .7em/1 var(--text)}
.hit{position:absolute;inset:0;z-index:1;border-radius:16px}
@media (hover:hover){.item:hover .ph img{transform:scale(1.07)}}
.item:active .ph img{transform:scale(.98)}
/* dish reveal */
.js .reveal .ph img{opacity:0;transform:scale(1.14);filter:brightness(.35) saturate(.5)}
.reveal.seen .ph img{opacity:1;transform:scale(1.02);filter:none;transition:opacity .7s ease,transform 1.1s var(--ease),filter 1.2s ease}
.reveal.seen .ph::after{animation:flash 1.5s ease-out .15s}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
.js .reveal .copy>*{opacity:0;transform:translateY(18px)}
.reveal.seen .copy>*{opacity:1;transform:none;transition:opacity .6s ease,transform .8s var(--ease)}
.reveal.seen .copy>:nth-child(2){transition-delay:.09s}
.reveal.seen .copy>:nth-child(3){transition-delay:.18s}
@media (hover:hover){.item.seen:hover .ph img{transform:scale(1.07)}}

/* best-seller badge */
.best{position:absolute;top:12px;inset-inline-start:12px;z-index:2;display:inline-flex;align-items:center;gap:7px;padding:7px 12px 6px 10px;border-radius:999px;background:var(--orange);color:#1b1612;font:800 15px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;box-shadow:0 8px 18px rgba(0,0,0,.45),0 0 0 3px rgba(242,106,33,.22);pointer-events:none}
[dir=rtl] .best{font:700 13px/1.1 var(--text);letter-spacing:0;padding:7px 10px 7px 12px}
.best svg{width:11px;height:14px;flex:none;fill:#1b1612;transform-origin:50% 90%;animation:flick 1.4s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.18,1.08) rotate(4deg)}}
.cimg .best{top:-8px;left:50%;inset-inline-start:auto;translate:-50% 0;padding:5px 9px 4px 8px;font-size:12px;gap:5px}
[dir=rtl] .cimg .best{font-size:11px;padding:5px 8px}
.cimg .best svg{width:9px;height:11px}
.sheet .best{top:16px;inset-inline-start:16px;font-size:17px;padding:9px 14px 8px 12px}
.js .reveal .best,.js .saucebar .best{opacity:0;scale:.5}
.reveal.seen .best{opacity:1;scale:1;transition:opacity .4s ease .55s,scale .6s cubic-bezier(.3,1.6,.5,1) .55s}
.saucebar.seen .best{opacity:1;scale:1;transition:opacity .4s ease,scale .6s cubic-bezier(.3,1.6,.5,1);transition-delay:calc(var(--k)*140ms + 1.2s)}

.best.new{background:var(--cream);color:var(--ink);box-shadow:0 8px 18px rgba(0,0,0,.45),0 0 0 3px rgba(244,232,216,.16)}
.best.new svg{width:13px;height:13px;fill:var(--orange);transform-origin:50% 50%;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.8) rotate(0)}50%{transform:scale(1.15) rotate(45deg)}}
.sheet .best.new svg{width:15px;height:15px}
.bdgs{position:absolute;top:12px;inset-inline-start:12px;z-index:2;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.bdgs .best{position:static}
.sheet .bdgs{top:16px;inset-inline-start:16px}
.best.jos{background:rgba(22,17,13,.78);color:var(--cream);border:1px solid rgba(244,232,216,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 8px 18px rgba(0,0,0,.45)}
.best.jos svg{width:17px;height:17px;fill:none;animation:none}
.sheet .best.jos svg{width:19px;height:19px}
.jos .o{fill:none;stroke:var(--cream);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.jos .f{fill:var(--orange);transform-origin:50% 90%;animation:flick 1.4s ease-in-out infinite}
.reveal.seen .bdgs .best:nth-child(2){transition-delay:.75s}
/* fries options + burger add-ons */
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.opts span{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid rgba(242,106,33,.45);color:var(--cream);font:600 15px/1 var(--text)}
.opts span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange)}
.adds{margin-top:16px;padding-top:12px;border-top:1px dashed rgba(244,232,216,.14);max-width:520px}
.adds-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.adds-l{font:700 15px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;color:var(--soft)}
[dir=rtl] .adds-l{font:600 14px/1 var(--text);letter-spacing:0}

const pricesHTML=(it,solo)=>it.sizes
  ?`<div class="prices">${it.sizes.map((v,i)=>`<span class="price"><span class="lb">${T[i?"double":"single"][L]}</span>${money(v)}</span>`).join("")}</div>`
  :`<div class="prices"><span class="price${solo?" solo":""}">${money(it.p)}</span></div>`;
const badge=it=>{
  const b=[];
  if(it.best)b.push(`<span class="best">${FLAME}${T.best[L]}</span>`);
  if(it.nw)b.push(`<span class="best new">${SPARK}${T.nw[L]}</span>`);
  if(it.josper)b.push(`<span class="best jos">${OVEN}${T.josper[L]}</span>`);
  return b.length>1?`<span class="bdgs">${b.join("")}</span>`:b.join("");
};
const pic=(it,lazy)=>`<div class="ph"><img src="assets/photos/${it.img}.webp" width="840" height="840" alt="${esc(it.n[L])}"${lazy?' loading="lazy" decoding="async"':""}>${badge(it)}</div>`;
const optsHTML=it=>it.opts?`<div class="opts">${it.opts.map(o=>`<span>${T[o][L]}</span>`).join("")}</div>`:"";
const addsHTML=it=>it.add?`<div class="adds"><div class="adds-h"><span class="adds-l">${T.addons[L]}</span><span class="adds-p">+${money(ADDON_PRICE)} <small>${T.each[L]}</small></span></div><div class="adds-row">${ADDONS.map(a=>`<span class="add"><img src="assets/addons/${a.img}.webp" width="160" height="160" alt="" loading="lazy">${esc(a.n[L])}</span>`).join("")}</div></div>`:"";
const row=(it,i,k)=>`<article class="item reveal${k%2?" flip":""}" data-i="${i}">${pic(it,i>1)}<div class="copy"><h3 class="name">${esc(it.n[L])}</h3>${it.d?`<p class="desc">${esc(it.d[L])}</p>`:""}${pricesHTML(it,true)}${optsHTML(it)}${addsHTML(it)}</div><button class="hit" type="button" data-open="${i}" aria-label="${T.view[L]}: ${esc(it.n[L])}"></button></article>`;
const saucebar=list=>{
  const shelf=(xs,off)=>`<div class="grp">
    <div class="cups">${xs.map(([it,i],k)=>`<button class="cimg" type="button" style="--k:${k+off}" data-open="${i}" data-cup="${i}" aria-label="${T.view[L]}: ${esc(it.n[L])}, ${it.p} ${T.cur[L]}${it.best?", "+T.best[L]:""}"><img src="assets/sauces/${it.img}.webp" width="420" height="370" alt="" loading="lazy" decoding="async">${badge(it)}</button>`).join("")}</div>
    <div class="plank" aria-hidden="true"></div>
    <div class="tags">${xs.map(([it,i],k)=>`<button class="stag" type="button" style="--k:${k+off};--tilt:${[-2.5,1.5,-1][k]}deg" data-open="${i}" aria-label="${T.view[L]}: ${esc(it.n[L])}">${esc(it.sn[L])}<span class="sp">${money(it.p)}</span></button>`).join("")}</div></div>`;
  return `<div class="saucebar"><h3 class="sub">${T.sauces[L]}</h3><p class="sb-tag">${T.sbTag[L]}</p><div class="shelves">${shelf(list.slice(0,3),0)}${shelf(list.slice(3),3)}</div></div>`;
};
const opener=c=>`<header class="op"><div class="ghost" aria-hidden="true"><span>${esc(c.n[L])}&nbsp;&nbsp;${esc(c.n[L])}&nbsp;&nbsp;${esc(c.n[L])}</span></div><h2 class="ttl" id="h-${c.id}">${esc(c.n[L])}</h2><p class="tag">${esc(c.t[L])}</p><div class="sear" aria-hidden="true">${[0,1,2,3].map(n=>`<i style="--n:${n}"></i>`).join("")}</div></header>`;
const tape=(c,k)=>{const one=`<span>${esc(c.n[L])}${FLAME}</span>`.repeat(6);return `<div class="tapewrap" aria-hidden="true"><div class="tape" style="--r:${k%2?2:-2}deg" data-dir="${k%2?1:-1}"><div class="track">${one}${one}</div></div></div>`};

function splitHero(){
  $$(".hero h1>span").forEach((el,line)=>{
    const words=el.textContent.trim().split(/\s+/);let i=0;
    el.innerHTML=words.map(w=>`<span class="w">${L?`<span class="c" style="--i:${i++}">${esc(w)}</span>`:[...w].map(ch=>`<span class="c" style="--i:${i++}">${esc(ch)}</span>`).join("")}</span>`).join(" ");
    el.setAttribute("aria-label",words.join(" "));
  });
}

function render(){
  const R=document.documentElement;R.lang=L?"ar":"en";R.dir=L?"rtl":"ltr";
  $$("[data-t]").forEach(e=>e.textContent=T[e.dataset.t][L]);
  splitHero();
  $(".bar").setAttribute("aria-label",T.cats[L]);
  const lb=$("#lang");lb.setAttribute("aria-label",T.langBtn[L]);lb.children[0].className=L?"":"on";lb.children[2].className=L?"on":"";
  $("#close").setAttribute("aria-label",T.close[L]);
  $("#tabs").innerHTML=CATS.map(c=>`<button class="tab" type="button" data-c="${c.id}">${esc(c.n[L])}</button>`).join("")+'<span class="ind" id="ind" aria-hidden="true"></span>';
  $("#menu").innerHTML=CATS.map((c,ci)=>{
    const list=ITEMS.map((it,i)=>[it,i]).filter(([it])=>it.c===c.id);
    const main=list.filter(([it])=>!it.s).map(([it,i],k)=>row(it,i,k)).join("");
    const sx=list.filter(([it])=>it.s);
    const sec=`<section class="sec" id="${c.id}" aria-labelledby="h-${c.id}">${opener(c)}<div class="list">${main}</div>${sx.length?saucebar(sx):""}</section>`;
    return sec+(CATS[ci+1]?tape(CATS[ci+1],ci):"");
  }).join("");
  bindTabs();observe();setTab(current||"burgers");measure();
}

/* tabs, indicator, scroll spy */
let current=null,lock=0;
function setTab(id){
  current=id;
  const tabs=$$(".tab");tabs.forEach(t=>t.setAttribute("aria-current",t.dataset.c===id?"true":"false"));
  const t=tabs.find(x=>x.dataset.c===id),ind=$("#ind");if(!t||!ind)return;
  const w=Math.max(t.offsetWidth-8,24);
  ind.style.width=w+"px";ind.style.transform=`translateX(${t.offsetLeft+(t.offsetWidth-w)/2}px)`;
  const box=$("#tabs");if(box.scrollWidth>box.clientWidth)t.scrollIntoView({block:"nearest",inline:"center"});
}
function replay(op){op.classList.remove("seen");void op.offsetWidth;op.classList.add("seen")}
function bindTabs(){
  $$(".tab").forEach(t=>t.addEventListener("click",()=>{
    const id=t.dataset.c,sec=document.getElementById(id);
    setTab(id);lock=Date.now();
    sec.scrollIntoView({behavior:RM?"auto":"smooth"});
    if(!RM)setTimeout(()=>replay(sec.querySelector(".op")),650);
  }));
}
let spy,rev;
function observe(){
  spy&&spy.disconnect();rev&&rev.disconnect();
  spy=new IntersectionObserver(es=>{if(Date.now()-lock<1000)return;es.forEach(e=>{if(e.isIntersecting)setTab(e.target.id)})},{rootMargin:"-35% 0px -60% 0px"});
  $$(".sec").forEach(s=>spy.observe(s));
  rev=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("seen");rev.unobserve(e.target)}}),{rootMargin:"0px 0px -10% 0px"});
  $$(".reveal,.op,.end,.saucebar").forEach(x=>rev.observe(x));
}

/* scroll-linked motion: hero parallax, ghost titles, tapes, progress */
let first=true,tapes=[],ghosts=[],heroH=0,docH=0,lastY=scrollY,vel=0,lastT=performance.now();
function measure(){
  heroH=$(".hero").offsetHeight;docH=document.documentElement.scrollHeight-innerHeight;
  tapes=$$(".tape").map(el=>{const tr=el.querySelector(".track");return {el,tr,x:0,half:tr.scrollWidth/2,dir:+el.dataset.dir}});
  ghosts=$$(".ghost span").map(el=>({el,sec:el.closest(".sec")}));
}
function frame(now){
  const dt=Math.min(64,now-lastT)/1000;lastT=now;
  const y=scrollY,dy=y-lastY;lastY=y;
  vel+=(Math.abs(dy)/Math.max(dt,.001)-vel)*.12;
  if(dy||first){$("#prog").style.setProperty("--p",docH>0?Math.min(1,y/docH).toFixed(4):0)}
  if(!RM){
    const hero=$(".hero");
    if((dy||first)&&y<heroH+50){
      hero.style.setProperty("--hy",(y*.42).toFixed(1)+"px");
      hero.style.setProperty("--ho",Math.max(0,1-y/(heroH*.75)).toFixed(3));
      hero.style.setProperty("--fy",(y*.16).toFixed(1)+"px");
    }
    const vh=innerHeight;
    if(dy||first)ghosts.forEach(g=>{const r=g.sec.getBoundingClientRect();if(r.bottom<-200||r.top>vh+200)return;const p=(vh-r.top)/(vh+r.height);g.el.style.setProperty("--gx",(-p*45+5).toFixed(2)+"vw")});
    const sp=60+Math.min(vel,2400)*.22;
    tapes.forEach(t=>{const r=t.el.getBoundingClientRect();if(r.bottom<0||r.top>vh)return;t.x+=sp*dt*t.dir;if(t.half){if(t.x<-t.half)t.x+=t.half;if(t.x>0)t.x-=t.half}t.tr.style.setProperty("--tx",t.x.toFixed(1)+"px")});
  }
  first=false;requestAnimationFrame(frame);
}
addEventListener("resize",()=>{measure();current&&setTab(current)});
addEventListener("load",()=>{measure();first=true});
document.fonts&&document.fonts.ready.then(()=>{measure();first=true});

/* dish sheet with the photo flying in from the menu */
const dlg=$("#sheet");
function openItem(i,src){
  const it=ITEMS[i];
  $("#sheet-in").innerHTML=`<div class="big"><img src="assets/photos/${it.img}.webp" width="840" height="840" alt="${esc(it.n[L])}">${badge(it)}</div><div class="body"><h3 class="name" id="sheet-name">${esc(it.n[L])}</h3>${it.d?`<p class="desc">${esc(it.d[L])}</p>`:""}${pricesHTML(it,false)}${optsHTML(it)}${addsHTML(it)}</div>`;
  const fly=!RM&&src&&dlg.showModal&&dlg.animate;
  dlg.classList.toggle("flip",!!fly);
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
  if(!fly)return;
  const a=src.getBoundingClientRect(),big=dlg.querySelector(".big img"),b=big.getBoundingClientRect();
  const f=new Image();f.src=big.src;f.className="flyer";f.alt="";
  Object.assign(f.style,{left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px"});
  dlg.appendChild(f);big.style.opacity=0;
  f.animate([{left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px",borderRadius:getComputedStyle(src.parentElement).borderRadius},{left:b.left+"px",top:b.top+"px",width:b.width+"px",height:b.height+"px",borderRadius:"0px"}],{duration:620,easing:"cubic-bezier(.2,.85,.2,1)",fill:"forwards"}).onfinish=()=>{big.style.opacity=1;f.remove()};
}
function closeSheet(){
  if(!dlg.open)return;
  if(RM){dlg.close();return}
  dlg.classList.add("closing");
  setTimeout(()=>{dlg.classList.remove("closing");dlg.close()},210);
}
document.addEventListener("click",e=>{const h=e.target.closest("[data-open]");if(!h)return;const i=+h.dataset.open,card=h.closest("article");openItem(i,card?card.querySelector(".ph img"):document.querySelector(`[data-cup="${i}"] img`))});
$("#close").addEventListener("click",closeSheet);
dlg.addEventListener("click",e=>{if(e.target===dlg)closeSheet()});
dlg.addEventListener("cancel",e=>{e.preventDefault();closeSheet()});

$("#lang").addEventListener("click",()=>{
  L=1-L;try{localStorage.setItem("bhm-lang",L)}catch(e){}
  render();document.body.classList.add("ready");
  $$(".reveal,.op,.end,.saucebar").forEach(x=>{const r=x.getBoundingClientRect();if(r.top<innerHeight)x.classList.add("seen")});
  const m=$("#menu");m.classList.remove("swap");void m.offsetWidth;m.classList.add("swap");
});

/* ambient particles */
const sp=$("#sparks");
for(let k=0;k<20;k++){const i=document.createElement("i");i.style.cssText=`--x:${6+Math.random()*88}%;--s:${2+Math.random()*3.5}px;--d:${3+Math.random()*3.6}s;--w:${(Math.random()*4).toFixed(2)}s;--dx:${(Math.random()*90-45).toFixed(0)}px`;sp.appendChild(i)}
const sm=$("#smoke");
for(let k=0;k<4;k++){const i=document.createElement("i");i.style.cssText=`--x:${15+k*20+Math.random()*8}%;--d:${7+Math.random()*4}s;--w:${(k*1.8).toFixed(1)}s;--dx:${(Math.random()*120-60).toFixed(0)}px`;sm.appendChild(i)}

/* opening sequence */
let started=false;
const heroLoaded=Promise.all($$(".food img").map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r})));
function startHero(){if(started)return;started=true;requestAnimationFrame(()=>requestAnimationFrame(()=>document.body.classList.add("ready")))}
const splash=$("#splash");
function curtain(first){
  if(RM){splash.hidden=true;startHero();return}
  splash.hidden=false;splash.classList.remove("out");
  const go=()=>{splash.classList.add("out");heroLoaded.then(()=>setTimeout(startHero,260));setTimeout(()=>{splash.hidden=true},1050)};
  const t=setTimeout(go,first?1500:1300);
  splash.onclick=()=>{clearTimeout(t);go()};
}
let seenSplash=false;try{seenSplash=sessionStorage.getItem("bhm-splash")==="1";sessionStorage.setItem("bhm-splash","1")}catch(e){}
render();
if(seenSplash&&!TABLET){splash.hidden=true;heroLoaded.then(startHero)}else curtain(true);
setTimeout(startHero,3600);
requestAnimationFrame(frame);

/* restaurant tablets: open with #tablet; after 2 idle minutes the menu resets for the next guest */
if(TABLET){
  let idle;const reset=()=>{clearTimeout(idle);idle=setTimeout(()=>{
    if(dlg.open)dlg.close();scrollTo({top:0,behavior:"auto"});
    document.body.classList.remove("ready");started=false;curtain(false);
  },120000)};
  ["pointerdown","keydown","scroll","touchstart"].forEach(ev=>addEventListener(ev,reset,{passive:true}));reset();
}
}
</script>
</body>
